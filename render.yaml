services:
  # 1. FastAPI Core Backend Service
  - type: web
    name: coachgenie-backend
    env: python
    pythonVersion: "3.11.9"
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOW_SEED
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://thecoachgenie.in,https://www.thecoachgenie.in,https://app.thecoachgenie.in,https://student.thecoachgenie.in,https://parent.thecoachgenie.in,https://coachgenie-frontend.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_DEFAULT_MODEL
        value: "llama-3.3-70b-versatile"
